name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: compose validate
        run: |
          for d in docker/*/; do
            f=$(ls "$d"compose.y*ml "$d"docker-compose.y*ml 2>/dev/null | head -1)
            [ -n "$f" ] || continue
            if [ -f "$d.env.example" ]; then cp "$d.env.example" "$d.env"; else touch "$d.env"; fi
            (cd "$d" && docker compose config -q --no-interpolate) || { echo "invalid: $d"; exit 1; }
          done
      - name: shellcheck
        run: shellcheck -S error bin/deploy
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
