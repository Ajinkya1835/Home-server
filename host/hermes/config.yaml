_config_version: 54
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
attachments:
  storage: hermes-home
plugins:
  clone_timeout_seconds: 300
  enabled:
    - minimalist-themes
    - quota
    - tool-slimmer
  disabled: []
  auto_apply: true
model:
  default: deepseek-flash
  provider: custom
  base_url: https://api.deepseek.com/v1
  api_mode: chat_completions
  api_key: <redacted>
  streaming: false
kanban:
  review_dispatch: true
cron:
  catch_up_missed: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  process_wait_auto_notify: true
  client_env_passthrough: []
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
  use_real_profile: true
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.4
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold:
  protect_first_n: 3
  idle_compact_after_seconds: 0
  hygiene_max_turn_hold_seconds: 10
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
prompt_caching:
  cache_ttl: 5m
memory:
  memory_enabled: true
  user_profile_enabled: true
  prefetch_spill_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  write_approval: true
max_concurrent_sessions:
group_sessions_per_user: true
streaming:
  enabled: false
skills:
  creation_nudge_interval: 15
  auto_load:
    - moa-council-chair
agent:
  max_turns: 90
  verbose: false
  reasoning_effort: low
  service_tier: ''
  fast_auto_seconds: 60
  personalities: {}
  disabled_toolsets: []
gateway:
  unmanaged_idle_exit_seconds: 600
  signal_interrupt_grace_timeout: 1
  service_install_choice:
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  allow_all_users: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: true
  auto_multiplex_migration: true
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
    history_tool_output_max_chars: 0
platform_toolsets:
  cli:
    - a2a
    - browser
    - computer_use
    - connections
    - cronjob
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tool-slimmer
    - tts
    - vision
    - web
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
    timeout: 60
    max_retries: 1
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
display:
  compact: true
  cleanup_progress: false
  suppress_warning_notifications: false
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  streaming: true
  skin: mono
  show_reasoning: false
  reasoning_full: false
  turn_summary: false
  interim_assistant_messages: false
  spinner_token_flow: false
  tool_progress_grouping: latest
  cli_layout: compact
  final_response_markdown: strip
  turn_completion_explainer: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
auth:
  adopt_external_logins: true
  codex_login_flow: device_code
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
smart_model_routing:
  enabled: false
approvals:
  mode: smart
proxy:
  enabled: false
memory_enabled: true
user_profile_enabled: true
prefetch_spill_enabled: true
known_plugin_toolsets:
  cli:
    - a2a
    - tool-slimmer
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
  - provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: https://integrate.api.nvidia.com/v1
command_allowlist:
  - script execution via -e/-c flag
webapp:
  enabled: true
  public_url: https://ajinkya.tail32b205.ts.net:8452
dashboard:
  basic_auth:
    username: ajinkya
    password_hash: <redacted>
  public_url: https://ajinkya.tail32b205.ts.net:8464
voice:
  voice_chat_mode: gpt-live
wake_word:
  enabled: true
bot_peers:
  laptop:
    url: http://100.111.191.70:8642
moa:
  presets:
    default:
      reference_models:
        - provider: gemini
          model: gemini-3-flash-preview
          enabled: true
        - provider: groq
          model: openai/gpt-oss-120b
          enabled: true
        - provider: groq
          model: qwen/qwen3.8-27b
          enabled: true
      degraded_reference_policy: loud
      fanout: user_turn
      aggregator:
        provider: custom
        model: deepseek-flash
      enabled: true
  reference_models:
    - provider: gemini
      model: gemini-3-flash-preview
      enabled: true
    - provider: groq
      model: openai/gpt-oss-120b
      enabled: true
    - provider: groq
      model: qwen/qwen3.8-27b
      enabled: true
  aggregator:
    provider: custom
    model: deepseek-flash
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: true
  save_traces: false
  default_preset: default
providers:
  groq:
    api: https://api.groq.com/openai/v1
    key_env: <redacted>
    default_model: openai/gpt-oss-120b
auxiliary:
  compression:
    provider: gemini
    model: gemini-3-flash-preview
  title_generation:
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  approval:
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  memory_query_rewrite:
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
