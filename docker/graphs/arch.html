<script>
if(window.top===window)document.body.style.background='#0b1022';
const ND='/nd/api/v1/';
const J=u=>fetch(ND+u).then(r=>r.json());
const set=(id,t)=>{const e=document.getElementById('v-'+id);if(e)e.textContent=t};
const last=async c=>{const r=await J('data?chart='+c+'&after=-8&points=1&group=average&format=json');const o={};r.labels.forEach((l,i)=>o[l]=r.data[0][i]);return o};
const sum=(o,skip=[])=>Object.keys(o).filter(k=>k!=='time'&&!skip.includes(k)).reduce((a,k)=>a+(o[k]||0),0);
async function tick(){
  try{const c=await last('system.cpu');set('cpu',Math.round(sum(c)-(c.idle||0))+'%')}catch(e){set('cpu','n/a')}
  try{const r=await last('system.ram');set('ram',Math.round(100*(r.used||0)/sum(r))+'%  ·  '+((r.used||0)/1024).toFixed(1)+' GiB')}catch(e){set('ram','n/a')}
  try{const s=await last('system.swap');set('swap',Math.round(100*(s.used||0)/Math.max(sum(s),1))+'%')}catch(e){set('swap','n/a')}
  try{const l=await last('system.load');set('load',(l.load1||0).toFixed(2))}catch(e){set('load','n/a')}
  try{const u=await last('system.uptime');const s=u.uptime||0;set('up',Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h')}catch(e){set('up','n/a')}
  let ids=[];
  try{ids=Object.keys((await J('charts')).charts)}catch(e){}
  try{
    const tc=ids.find(i=>/k10temp|coretemp/i.test(i)&&/temp/i.test(i))||ids.find(i=>/sensors.*temp/i.test(i));
    if(tc){const t=await last(tc);set('temp',Math.round(Math.max(...Object.keys(t).filter(k=>k!=='time').map(k=>t[k])))+' °C')}else set('temp','n/a')
  }catch(e){set('temp','n/a')}
  const norm=ids.map(i=>i.replace(/-/g,'_'));let up=0;
  document.querySelectorAll('g.n[data-c]').forEach(g=>{
    const n='cgroup_'+g.dataset.c.replace(/-/g,'_')+'.';
    const ok=norm.some(i=>i.startsWith(n));g.querySelector('.dot').classList.toggle('up',ok);if(ok)up++;
  });
  set('ct',ids.length?up+' / 13':'n/a');
}
tick();setInterval(tick,5000);
</script></body></html>
