    columns: 3
  Tools:
    tab: Home
    icon: mdi-toolbox-outline
    style: row
    columns: 4
  Ops:
    tab: Home
    icon: mdi-shield-check-outline
    style: row
    columns: 5
  Live:
    tab: Observe
    icon: mdi-pulse
    style: row
    columns: 3
  Live graphs:
    tab: Observe
    icon: mdi-chart-areaspline
    style: row
    columns: 1
  Architecture:
    tab: Map
    icon: mdi-sitemap
    style: row
    columns: 1
