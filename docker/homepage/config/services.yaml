# <<< deployments
- Media:
  - Immich:
      icon: immich.png
      href: https://ajinkya.tail32b205.ts.net
      description: Photos & videos
      server: homelab
      container: immich_server
      widget:
        type: immich
        url: http://immich_server:2283
        key: '{{HOMEPAGE_VAR_IMMICH_KEY}}'
        version: 2
  - Jellyfin:
      icon: jellyfin.png
      href: https://ajinkya.tail32b205.ts.net:10000
      description: Movies & shows
      server: homelab
      container: jellyfin
      siteMonitor: http://jellyfin:8096
      widget:
        type: jellyfin
        url: http://jellyfin:8096
        key: '{{HOMEPAGE_VAR_JELLYFIN_KEY}}'
        version: 2
        enableUser: true
        enableNowPlaying: true
  - File Browser:
      icon: filebrowser.png
      href: https://ajinkya.tail32b205.ts.net:8451
      description: hdd1 files
      server: homelab
      container: filebrowser
- Tools:
  - Vaultwarden:
      icon: vaultwarden.png
      href: https://ajinkya.tail32b205.ts.net:8443
      description: Passwords
      server: homelab
