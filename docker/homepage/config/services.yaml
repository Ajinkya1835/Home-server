      description: Container logs
      server: homelab
      container: dozzle
  - Scrutiny:
      icon: scrutiny.png
      href: https://ajinkya.tail32b205.ts.net:8463
      description: Drive health
      server: homelab
      container: scrutiny
  - DeepSeek:
      icon: deepseek.png
      href: https://platform.deepseek.com/usage
      description: API balance
      widget:
        type: customapi
        url: http://127.0.0.1:3000/deepseek.json
        refreshInterval: 60000
        mappings:
        - field: balance
          label: Balance
          format: float
          suffix: ' USD'
        - field: spent_today
          label: Today
          format: float
          suffix: ' USD'
- Ops:
