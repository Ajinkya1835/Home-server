- Live:
  - CPU:
      icon: mdi-cpu-64-bit
      description: Load by core
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.cpu&after=-1&points=1&format=json
        refreshInterval: 10000
        mappings:
        - field: data.0.6
          label: User
          format: float
          suffix: '%'
        - field: data.0.7
          label: System
          format: float
          suffix: '%'
        - field: data.0.9
          label: IOWait
          format: float
          suffix: '%'
  - RAM:
      icon: mdi-memory
      description: Memory
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.ram&after=-1&points=1&format=json
        refreshInterval: 10000
        mappings:
        - field: data.0.2
          label: Used
          format: float
          suffix: ' MiB'
        - field: data.0.3
          label: Cache
          format: float
          suffix: ' MiB'
        - field: data.0.1
          label: Free
          format: float
          suffix: ' MiB'
  - Load:
      icon: mdi-gauge
      description: 1 / 5 / 15 min
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.load&after=-1&points=1&format=json
        refreshInterval: 10000
        mappings:
        - field: data.0.1
          label: 1 min
          format: float
        - field: data.0.2
          label: 5 min
          format: float
        - field: data.0.3
          label: 15 min
          format: float
  - Network:
      icon: mdi-lan
      description: Throughput
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.net&after=-1&points=1&format=json
        refreshInterval: 10000
        mappings:
        - field: data.0.1
          label: Down
          format: float
          suffix: ' kb/s'
        - field: data.0.2
          label: Up
          format: float
          scale: -1
          suffix: ' kb/s'
  - Disk I/O:
      icon: mdi-harddisk
      description: All devices
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.io&after=-1&points=1&format=json
        refreshInterval: 10000
        mappings:
        - field: data.0.1
          label: Read
          format: float
          suffix: ' KiB/s'
        - field: data.0.2
          label: Write
          format: float
          scale: -1
          suffix: ' KiB/s'
  - CPU temp:
      icon: mdi-thermometer
      description: Package
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=sensors.temperature_k10temp-pci-00c3_temp1_Tctl_input&after=-1&points=1&format=json
        refreshInterval: 10000
        mappings:
        - field: data.0.1
          label: CPU
          format: float
          suffix: ' °C'
  - GPU temp:
      icon: mdi-expansion-card
      description: Edge
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=sensors.temperature_amdgpu-pci-0300_temp1_edge_input&after=-1&points=1&format=json
        refreshInterval: 10000
        mappings:
        - field: data.0.1
          label: GPU
          format: float
          suffix: ' °C'
- Live graphs:
