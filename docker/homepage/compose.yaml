services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./config:/app/config
      # NOTE: never mount a whole directory over /app/public - it hides the app's own
      # locales/ and assets, and every UI label then renders as a raw i18n key.
      - ./public/favicon.ico:/app/public/favicon.ico:ro
      - ./public/favicon-32.png:/app/public/favicon-32.png:ro
      - ./public/icon-192.png:/app/public/icon-192.png:ro
      - ./public/icon-512.png:/app/public/icon-512.png:ro
      - ./public/apple-touch-icon.png:/app/public/apple-touch-icon.png:ro
      - ./public/deepseek.json:/app/public/deepseek.json:ro
      # read-only: widgets only inspect containers, they never write
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt:/mnt:ro,rslave
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=ajinkya.tail32b205.ts.net:8450,localhost:3030,127.0.0.1:3030
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - immich
      - jellyfin
      - netdata
networks:
  immich:
    name: immich_default
    external: true
  jellyfin:
    name: jellyfin_default
    external: true
  netdata:
    name: netdata_default
    external: true
