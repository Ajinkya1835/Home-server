services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./config:/app/config
      # read-only: widgets only inspect containers, they never write
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt:/mnt:ro,rslave
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=ajinkya.tail32b205.ts.net:8450,localhost:3030,127.0.0.1:3030
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - immich
      - jellyfin
      - netdata
networks:
  immich:
    name: immich_default
    external: true
  jellyfin:
    name: jellyfin_default
    external: true
  netdata:
    name: netdata_default
    external: true
