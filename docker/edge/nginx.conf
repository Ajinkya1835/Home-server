# Edge router for the public hostname.
#   /portfolio/  -> static showcase (this repo)
#   everything else -> Immich (unchanged behaviour for the app and share links)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 0;          # Immich uploads
    proxy_request_buffering off;

    # --- static showcase -------------------------------------------------
    location = /portfolio { return 301 /portfolio/; }

    location /portfolio/ {
        alias /usr/share/nginx/html/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # --- Immich ----------------------------------------------------------
    location / {
        proxy_pass http://immich_server:2283;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
