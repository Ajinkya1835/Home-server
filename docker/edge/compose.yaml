services:
  edge:
    image: nginx:alpine
    container_name: edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:80"     # tailscale funnel :443 points here
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/portfolio/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - immich
networks:
  immich:
    name: immich_default
    external: true
