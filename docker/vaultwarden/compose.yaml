services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - SIGNUPS_ALLOWED=false
      - DOMAIN=https://ajinkya.tail32b205.ts.net:8443
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8081:80"
    security_opt:
      - no-new-privileges:true

