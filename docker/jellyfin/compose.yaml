services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "110"
    volumes:
      - /mnt/backup/media/config:/config
      - /mnt/backup/media/movies:/media/movies
      - /mnt/backup/media/tv:/media/tv
      - /mnt/backup/media/youtube:/media/youtube
      - /mnt/backup/media/archive:/media/archive
      - /mnt/backup/media/music:/media/music
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      - TZ=Asia/Kolkata
