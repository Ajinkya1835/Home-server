services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - DOMAIN=http://100.94.248.64:8081
    volumes:
      - ./data:/data
    ports:
      - "8081:80"
    security_opt:
      - no-new-privileges:true

