services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - DOMAIN=https://ajinkya.tail32b205.ts.net:8451
    volumes:
      - ./data:/data
    ports:
      - "8081:80"
    security_opt:
      - no-new-privileges:true

