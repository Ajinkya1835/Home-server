name: monitoring
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    cpus: 1
    mem_limit: 512m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/hdd1/monitoring-data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    cpus: 0.3
    mem_limit: 128m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
      - /mnt/hdd1/monitoring-data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    cpus: 0.3
    mem_limit: 128m
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    cpus: 0.2
    mem_limit: 128m
    ports:
      - '9093:9093'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /mnt/hdd1/monitoring-data/alertmanager:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    cpus: 1
    mem_limit: 512m
    ports:
      - '3000:3000'
    volumes:
      - /mnt/hdd1/monitoring-data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=changeme
    restart: unless-stopped

  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    container_name: alertmanager-discord
    cpus: 0.1
    mem_limit: 64m
    environment:
      - DISCORD_WEBHOOK=https://discord.com/api/webhooks/1538257255382777948/9a3X6ZNMB-FQtADD1pqChJmXeX2MttN0ith85po0Y0fwEr_g_6VvwEmZQh--V3L6vxgF
    restart: unless-stopped
