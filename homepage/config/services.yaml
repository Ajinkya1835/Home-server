- Live:
  - CPU now:
      icon: mdi-cpu-64-bit
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.cpu&after=-1&points=1&format=json
        refreshInterval: 2000
        mappings:
        - field: data.0.6
          label: User
          format: float
          suffix: '%'
        - field: data.0.7
          label: System
          format: float
          suffix: '%'
        - field: data.0.9
          label: IO wait
          format: float
          suffix: '%'
  - RAM now:
      icon: mdi-memory
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.ram&after=-1&points=1&format=json
        refreshInterval: 2000
        mappings:
        - field: data.0.2
          label: Used
          format: float
          suffix: ' MiB'
        - field: data.0.3
          label: Cache
          format: float
          suffix: ' MiB'
        - field: data.0.1
          label: Free
          format: float
          suffix: ' MiB'
  - Load:
      icon: mdi-gauge
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.load&after=-1&points=1&format=json
        refreshInterval: 2000
        mappings:
        - field: data.0.1
          label: 1 min
          format: float
        - field: data.0.2
          label: 5 min
          format: float
        - field: data.0.3
          label: 15 min
          format: float
  - Network:
      icon: mdi-lan
      widget:
        type: customapi
        url: http://netdata:19999/api/v1/data?chart=system.net&after=-1&points=1&format=json
